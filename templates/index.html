<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Soil Plant Recommender</title>
    <link rel="stylesheet" href="index.css" />
</head>
<body style="display: flex; justify-content: center; align-items: center; flex-direction: column; background-color: bisque; font-size: larger;">
    
    <h1 style="font-size: x-large;">Soil Plant Recommender</h1>

    <form method="POST">
        <label for="city">City:</label>
        <input type="text" id="city" name="city" required /><br><br>

        <label for="soil_pH">Soil pH:</label>
        <input type="number" step="0.1" id="soil_pH" name="soil_pH" required /><br><br>

        <label for="soil_moisture">Soil Moisture:</label>
        <input type="number" step="0.1" id="soil_moisture" name="soil_moisture" required /><br><br>

        <button type="submit">Get Recommendations</button><br><br>
    </form>

    {% if recommendations %}
    <h2>Recommended Plants:</h2>
    <ul>
        {% for plant in recommendations %}
        <li>{{ plant["Plant"] }}</li>
        {% endfor %}
    </ul><br><br>
    {% else %}
    <p>No plants match the given conditions.</p>
    {% endif %}
    
</body>
</html>
